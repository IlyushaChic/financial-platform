apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: financial-platform
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: your-registry/auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
        env:
        - name: POSTGRES_DSN
          value: "postgres://platform:secret@postgres:5432/platform?sslmode=disable"
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: JWT_SECRET
          value: "supersecretkey"
        - name: GRPC_PORT
          value: "50051"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
