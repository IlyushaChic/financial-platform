apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financial-platform-ingress
  namespace: financial-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: financial-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080