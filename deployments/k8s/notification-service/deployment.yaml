apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: financial-platform
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: your-registry/notification-service:latest
        imagePullPolicy: Never
        env:
        - name: RABBITMQ_URL
          value: "amqp://admin:admin@rabbitmq:5672/"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
