apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: financial-platform
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: AUTH_SERVICE_ADDR
          value: "auth-service:50051"
        - name: TRANSACTION_SERVICE_ADDR
          value: "transaction-service:50052"
        - name: RABBITMQ_URL
          value: "amqp://admin:admin@rabbitmq:5672/"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
